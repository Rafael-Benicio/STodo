<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STodo Desktop</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="modal.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>STodo Desktop</h1>
                <button id="themeToggle" title="Toggle Dark Mode">🌙</button>
            </div>
        </header>

        <nav class="tabs">
            <button id="tabPending" class="active">Pendentes</button>
            <button id="tabCompleted">Concluídas</button>
            <button id="tabPriorities">Prioridades</button>
            <select id="sortActionsSelect" class="sort-dropdown" title="Opções de ordenação">
                <option value="" disabled selected>⚡ Organizar...</option>
                <option value="shuffle">🔀 Aleatorizar</option>
                <option value="checks">📊 Ordenar por Checks</option>
                <option value="color">🎨 Agrupar por Cor</option>
            </select>
        </nav>

        <main>
            <section class="task-input" id="taskInputSection">
                <input type="text" id="taskTitle" placeholder="O que precisa ser feito?">
                <select id="taskRenewalSelect" class="renewal-input-select" title="Renovação automática">
                    <option value="0" selected>Sem renovação</option>
                    <option value="1440">Diário</option>
                    <option value="2880">2 Dias</option>
                    <option value="10080">Semanal (7d)</option>
                </select>
                <button id="addBtn">Adicionar</button>
            </section>

            <section class="priority-input" id="priorityInputSection" style="display: none;">
                <input type="text" id="priorityName" placeholder="Nome da prioridade (ex: Urgente, Alta...)">
                <input type="color" id="priorityColor" value="#e91e63" title="Escolha a cor da prioridade">
                <button id="addPriorityBtn">Adicionar Prioridade</button>
            </section>

            <section class="task-list" id="taskListSection">
                <ul id="tasks">
                    <!-- Tarefas aparecerão aqui -->
                </ul>
            </section>

            <section class="priority-list" id="priorityListSection" style="display: none;">
                <ul id="priorities">
                    <!-- Prioridades aparecerão aqui -->
                </ul>
            </section>
        </main>
    </div>

    <div id="taskModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTaskTitle">Configurações da Tarefa</h3>
                <button type="button" id="modalCloseBtn" class="modal-close-btn" title="Fechar">✕</button>
            </div>
            <div class="modal-body">
                <div class="modal-row">
                    <span class="modal-label">⏱️ Renovação Automática:</span>
                    <div id="modalRenewalContainer"></div>
                </div>
                <div class="modal-row">
                    <span class="modal-label">🎨 Prioridade & Cor:</span>
                    <div id="modalPriorityContainer"></div>
                </div>
                <div class="modal-row modal-danger-row">
                    <span class="modal-label">Exclusão:</span>
                    <div id="modalDeleteContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="autoUncheck.js"></script>
    <script src="priorities.js"></script>
    <script src="taskModal.js"></script>
    <script src="renderer.js"></script>
</body>
</html>
